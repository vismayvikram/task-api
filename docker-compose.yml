services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/taskdb
      - JWT_SECRET=f3a7d291e03b41d9a24c5b190f821a7003ef92bc21a403986a1df0d922a10d932187b9e072b21c4b109b02a12f912c3b
    depends_on:
      - db
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:  
  pgdata: